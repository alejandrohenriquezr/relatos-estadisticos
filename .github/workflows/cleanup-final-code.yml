name: Limpieza funcional y lint final

on:
  push:
    branches: [main]
    paths:
      - "scripts/cleanup-final-code.py"
      - ".github/workflows/cleanup-final-code.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar transformaciones auditables
        run: python3 scripts/cleanup-final-code.py
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Formatear archivos modificados
        run: npx prettier --write app/page.tsx app/EconomicPage.tsx lib/labor-sdmx.ts lib/price-sdmx.ts eslint.config.mjs
      - name: Validar lint
        run: npm run lint
      - name: Construir sitio
        run: npm run build
      - name: Probar render SSR
        run: node --test tests/rendered-html.test.mjs
      - name: Probar rutas y MCP
        run: node --import tsx --test tests/cache-first-routes.test.ts tests/mcp-statistics.test.ts
      - name: Validar integridad
        run: python3 scripts/check-repository-integrity.py
      - name: Configurar autor
        run: git config user.name github-actions-bot
      - name: Configurar correo
        run: git config user.email github-actions-bot@users.noreply.github.com
      - name: Versionar cambios validados
        run: git add app/page.tsx app/EconomicPage.tsx lib/labor-sdmx.ts lib/price-sdmx.ts eslint.config.mjs && git commit -m "Corrige lint funcional y SSR" && git push origin HEAD:main
