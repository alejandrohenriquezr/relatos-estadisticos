name: Limpieza funcional y lint final

on:
  push:
    branches: [main]
    paths:
      - "scripts/cleanup-final-code.py"
      - "scripts/enable-mandatory-lint.py"
      - ".github/workflows/cleanup-final-code.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar transformaciones auditables
        run: python3 scripts/cleanup-final-code.py
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Formatear archivos modificados
        run: npx prettier --write app/page.tsx app/EconomicPage.tsx lib/labor-sdmx.ts lib/price-sdmx.ts eslint.config.mjs
      - name: Validar lint
        run: npm run lint
      - name: Ejecutar pruebas completas
        run: NODE_OPTIONS=--enable-source-maps npm test
      - name: Validar integridad
        run: python3 scripts/check-repository-integrity.py
      - name: Activar lint obligatorio
        run: python3 scripts/enable-mandatory-lint.py
      - name: Configurar autor
        run: git config user.name github-actions-bot
      - name: Configurar correo
        run: git config user.email github-actions-bot@users.noreply.github.com
      - name: Versionar cambios validados
        run: git add app/page.tsx app/EconomicPage.tsx lib/labor-sdmx.ts lib/price-sdmx.ts eslint.config.mjs .github/workflows/ci.yml && git commit -m "Corrige lint funcional y lo hace obligatorio" && git push origin HEAD:main
