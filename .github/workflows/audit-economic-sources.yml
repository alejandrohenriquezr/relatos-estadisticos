name: Regenerar fallbacks económicos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-economic-sources.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar dependencias
        run: npm ci --ignore-scripts

      - name: Regenerar fallbacks desde fuentes oficiales
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseEconomicWorkbook } from './lib/economic-data.ts';
          import { parseIppOfficialFiles } from './lib/ipp-official-data.ts';

          const fetchBytes = async (url) => {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: {
                'cache-control': 'no-cache',
                'user-agent': 'INE-Relatos-source-regenerator/1.0',
              },
            });
            if (!response.ok) throw new Error(`${response.status} al descargar ${url}`);
            const bytes = await response.arrayBuffer();
            const signature = Buffer.from(bytes).subarray(0, 4).toString('hex');
            if (!['504b0304', 'd0cf11e0'].includes(signature))
              throw new Error(`Firma Excel inesperada ${signature} para ${url}`);
            return bytes;
          };

          const economicSources = {
            energy: 'https://www.ine.gob.cl/docs/default-source/produccion-de-electricidad-gas-y-agua/cuadros-estadisticos/base-promedio-2018-100/series-empalmadas-y-mensuales-a-julio-2026.xls',
            industry: 'https://www.ine.gob.cl/docs/default-source/indice-de-produccion-industrial/cuadros-estadisticos/base-promedio-2018-100/series-empalmadas-y-mensuales-a-julio-2026.xls',
            permits: 'https://www.ine.gob.cl/docs/default-source/permisos-de-edificacion/cuadros-estadisticos/series-mensuales/series-históricas-a-julio-2026.xls',
          };
          const economicOutputs = {
            energy: 'public/economic-energy.json',
            industry: 'public/economic-industry.json',
            permits: 'public/economic-permits.json',
          };

          for (const kind of ['energy', 'industry', 'permits']) {
            const payload = parseEconomicWorkbook(await fetchBytes(economicSources[kind]), kind);
            const latest = kind === 'permits' ? payload.surface.total.at(-1) : payload.main.at(-1);
            if (!latest || latest.year !== 2026 || latest.month !== 7)
              throw new Error(`${kind} no termina en julio de 2026: ${JSON.stringify(latest)}`);
            fs.writeFileSync(economicOutputs[kind], `${JSON.stringify(payload, null, 2)}\n`, 'utf8');
            console.log(`ECONOMIC_${kind.toUpperCase()}_OK`, JSON.stringify(latest));
          }

          const industry = JSON.parse(fs.readFileSync('public/economic-industry.json', 'utf8')).main.at(-1);
          const permits = JSON.parse(fs.readFileSync('public/economic-permits.json', 'utf8')).surface.total.at(-1);
          if (Math.abs(industry.annual - (-5.06436461058416)) > 1e-9)
            throw new Error(`IPI julio inesperado: ${industry.annual}`);
          if (Math.abs(permits.annual - (-17.980600945977883)) > 1e-9)
            throw new Error(`Permisos julio inesperado: ${permits.annual}`);

          const ippSources = {
            industries: 'https://www.ine.gob.cl/docs/default-source/indice-de-precios-de-productor/cuadros-estadisticos/base-anual-2019-100/industrias-xlsx.xlsx',
            mining: 'https://www.ine.gob.cl/docs/default-source/indice-de-precios-de-productor/cuadros-estadisticos/base-anual-2019-100/miner%C3%ADa-xlsx.xlsx',
            ipdega: 'https://www.ine.gob.cl/docs/default-source/indice-de-precios-de-productor/cuadros-estadisticos/base-anual-2019-100/ipdega-xlsx',
            manufacturing: 'https://www.ine.gob.cl/docs/default-source/indice-de-precios-de-productor/cuadros-estadisticos/base-anual-2019-100/industria-manufacturera-xlsx.xlsx',
          };
          const files = {};
          for (const [key, url] of Object.entries(ippSources))
            files[key] = await fetchBytes(`${url}?_ine_refresh=${Date.now()}`);

          const ipp = parseIppOfficialFiles(files);
          const latestIndustry = ipp.data.industries.at(-1);
          const latestIpdega = ipp.data.ipdega.series.at(-1);
          const latestManufacturing = ipp.data.manufacturing.series.at(-1);
          if (!latestIndustry || latestIndustry.year !== 2026 || latestIndustry.month !== 7 || latestIndustry.monthly !== 1.9)
            throw new Error(`IPP Industrias inesperado: ${JSON.stringify(latestIndustry)}`);
          if (!latestIpdega || latestIpdega.year !== 2026 || latestIpdega.month !== 7 || latestIpdega.monthly !== 1)
            throw new Error(`IPDEGA inesperado: ${JSON.stringify(latestIpdega)}`);
          if (!latestManufacturing || latestManufacturing.year !== 2026 || latestManufacturing.month !== 7)
            throw new Error(`IPP Manufactura inesperado: ${JSON.stringify(latestManufacturing)}`);

          ipp.data.updated = 'Julio de 2026';
          fs.writeFileSync('public/ipp-data.json', `${JSON.stringify(ipp.data, null, 2)}\n`, 'utf8');
          fs.writeFileSync('public/ippman-divisions.json', `${JSON.stringify(ipp.divisions, null, 2)}\n`, 'utf8');

          const latestDivisionPeriod = ipp.divisions.reduce(
            (latest, item) => !latest || item.year > latest.year || (item.year === latest.year && item.month > latest.month) ? item : latest,
            null,
          );
          if (!latestDivisionPeriod || latestDivisionPeriod.year !== 2026 || latestDivisionPeriod.month !== 7)
            throw new Error(`Divisiones manufactureras desactualizadas: ${JSON.stringify(latestDivisionPeriod)}`);

          console.log('IPP_INDUSTRIES_OK', JSON.stringify(latestIndustry));
          console.log('IPP_IPDEGA_OK', JSON.stringify(latestIpdega));
          console.log('IPP_MANUFACTURING_OK', JSON.stringify(latestManufacturing));
          console.log('IPP_DIVISIONS_LATEST_OK', JSON.stringify(latestDivisionPeriod));
          NODE

      - name: Validar integridad y períodos
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-repository-integrity.py
          grep -q '"month": 7' public/economic-energy.json
          grep -q '"month": 7' public/economic-industry.json
          grep -q '"month": 7' public/economic-permits.json
          grep -q '"updated": "Julio de 2026"' public/ipp-data.json
          grep -q '"month": 7' public/ippman-divisions.json

      - name: Versionar fallbacks actualizados
        shell: bash
        run: |
          set -euo pipefail
          files=(
            public/economic-energy.json
            public/economic-industry.json
            public/economic-permits.json
            public/ipp-data.json
            public/ippman-divisions.json
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'ECONOMIC_FALLBACKS_ALREADY_CURRENT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Actualiza fallbacks económicos a julio de 2026'
          git push origin HEAD:main
