name: Auditoría mercado laboral e IPC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-labor-prices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar dependencias
        run: npm ci --ignore-scripts

      - name: Comparar fuentes oficiales con snapshots
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseEneOfficialFiles } from './lib/ene-official-data.ts';
          import { parseInformalityOfficialFiles } from './lib/informality-official-data.ts';
          import { parseIpcOfficialFiles } from './lib/ipc-official-data.ts';

          const get = async (url) => {
            const response = await fetch(url, {redirect:'follow',headers:{'cache-control':'no-cache','user-agent':'INE-Relatos-source-audit/1.0'}});
            if (!response.ok) throw new Error(`${response.status} ${url}`);
            return response.arrayBuffer();
          };

          const eneUrls = {
            indicators:'https://www.ine.gob.cl/docs/default-source/ocupacion-y-desocupacion/cuadros-estadisticos/series-vigentes/indicadores_principales.xlsx',
            branches:'https://www.ine.gob.cl/docs/default-source/ocupacion-y-desocupacion/cuadros-estadisticos/series-vigentes/rama.xlsx',
            categories:'https://www.ine.gob.cl/docs/default-source/ocupacion-y-desocupacion/cuadros-estadisticos/series-vigentes/categoria.xlsx',
            absent:'https://www.ine.gob.cl/docs/default-source/ocupacion-y-desocupacion/cuadros-estadisticos/series-vigentes/ocupados_ausentes.xlsx',
          };
          const eneFiles = Object.fromEntries(await Promise.all(Object.entries(eneUrls).map(async ([key,url])=>[key,await get(url)])));
          const ene = parseEneOfficialFiles(eneFiles);
          const eneRemote = ene.series.Total.at(-1);
          const eneFallback = JSON.parse(fs.readFileSync('public/ene-data.json','utf8'));
          const eneFallbackLatest = eneFallback.series?.Total?.at?.(-1) ?? null;
          console.log('ENE_REMOTE_LATEST', JSON.stringify(eneRemote));
          console.log('ENE_FALLBACK_LATEST', JSON.stringify(eneFallbackLatest));
          if (!eneRemote || eneRemote.year !== 2026 || !/mayo\s*-?\s*julio|may\s*-?\s*jul/i.test(String(eneRemote.quarter)))
            throw new Error(`ENE remoto no corresponde a mayo-julio 2026: ${JSON.stringify(eneRemote)}`);

          const infUrls = {
            rates:'https://www.ine.gob.cl/docs/default-source/informalidad-y-condiciones-laborales/cuadros-estadisticos/proyecciones_censo_2017/informalidad_tasas.xlsx',
            branches:'https://www.ine.gob.cl/docs/default-source/informalidad-y-condiciones-laborales/cuadros-estadisticos/proyecciones_censo_2017/informalidad_rama.xlsx',
            categories:'https://www.ine.gob.cl/docs/default-source/informalidad-y-condiciones-laborales/cuadros-estadisticos/proyecciones_censo_2017/informalidad_categoria.xlsx',
            groups:'https://www.ine.gob.cl/docs/default-source/informalidad-y-condiciones-laborales/cuadros-estadisticos/proyecciones_censo_2017/informalidad_grupo.xlsx',
          };
          const infFiles = Object.fromEntries(await Promise.all(Object.entries(infUrls).map(async ([key,url])=>[key,await get(url)])));
          const informal = parseInformalityOfficialFiles(infFiles);
          const infRemote = informal.rates.at(-1);
          const infFallback = JSON.parse(fs.readFileSync('public/informality-data.json','utf8'));
          const infFallbackLatest = infFallback.rates?.at?.(-1) ?? null;
          console.log('INFORMALITY_REMOTE_UPDATED', informal.updated);
          console.log('INFORMALITY_REMOTE_LATEST', JSON.stringify(infRemote));
          console.log('INFORMALITY_FALLBACK_UPDATED', JSON.stringify(infFallback.updated ?? null));
          console.log('INFORMALITY_FALLBACK_LATEST', JSON.stringify(infFallbackLatest));
          if (!infRemote || infRemote.year !== 2026 || Math.abs(infRemote.rate - 26.5) > 0.051)
            throw new Error(`Informalidad remota inesperada: ${JSON.stringify(infRemote)}`);

          const ipcUrls = {
            ipc:'https://www.ine.gob.cl/docs/default-source/%C3%ADndice-de-precios-al-consumidor/cuadros-estadisticos/base-anual-2023_100/series-de-tiempo/ipc-xls.xlsx',
            analytics:'https://www.ine.gob.cl/docs/default-source/%C3%ADndice-de-precios-al-consumidor/cuadros-estadisticos/base-anual-2023_100/series-de-tiempo/analiticos-xls.xlsx',
          };
          const ipcFiles = Object.fromEntries(await Promise.all(Object.entries(ipcUrls).map(async ([key,url])=>[key,await get(`${url}?_ine_refresh=${Date.now()}`)])));
          const ipc = parseIpcOfficialFiles(ipcFiles);
          const ipcRemote = ipc.data.series.filter(item=>item.division===0).at(-1);
          const ipcFallback = JSON.parse(fs.readFileSync('public/ipc-data.json','utf8'));
          const ipcFallbackLatest = ipcFallback.series?.filter?.(item=>item.division===0)?.at?.(-1) ?? null;
          const analyticsFallback = JSON.parse(fs.readFileSync('public/ipc-analytics.json','utf8'));
          console.log('IPC_REMOTE_LATEST', JSON.stringify(ipcRemote));
          console.log('IPC_FALLBACK_UPDATED', JSON.stringify(ipcFallback.updated ?? null));
          console.log('IPC_FALLBACK_LATEST', JSON.stringify(ipcFallbackLatest));
          console.log('IPC_ANALYTICS_REMOTE_LATEST', JSON.stringify(ipc.analytics.series.at(-1)));
          console.log('IPC_ANALYTICS_FALLBACK_LATEST', JSON.stringify(analyticsFallback.series?.at?.(-1) ?? null));
          if (!ipcRemote || ipcRemote.year !== 2026 || ipcRemote.month !== 8 || Math.abs(ipcRemote.monthly - 0.6) > 0.001 || Math.abs(ipcRemote.annual - 4.1) > 0.001)
            throw new Error(`IPC agosto 2026 inesperado: ${JSON.stringify(ipcRemote)}`);
          NODE
