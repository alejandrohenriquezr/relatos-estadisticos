name: Diagnóstico fuentes policiales 2025

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-police-2025.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspeccionar página y configuración Sitefinity
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.ine.gob.cl/estadisticas-por-tema/sociedad-y-condiciones-de-vida/estadisticas-policiales-y-judiciales'
          curl -L --fail --max-time 60 --retry 2 \
            --user-agent 'Mozilla/5.0 INE-Relatos-source-audit/1.0' \
            "$page" -o /tmp/police.html
          echo "HTML_BYTES $(wc -c < /tmp/police.html)"

          echo '=== XLSX/XLS references ==='
          grep -Eoi 'https?://[^"'"'"' <>]+\.(xlsx|xls)(\?[^"'"'"' <>]*)?|/[^"'"'"' <>]+\.(xlsx|xls)(\?[^"'"'"' <>]*)?' /tmp/police.html \
            | sed 's/&amp;/\&/g' | sort -u | head -n 100 || true

          echo '=== Sitefinity/API references ==='
          grep -Eoi 'https?://[^"'"'"' <>]+|/[^"'"'"' <>]+' /tmp/police.html \
            | grep -Ei 'sitefinity|api/default|sf-|document|download|cuadro|library' \
            | sort -u | head -n 150 || true

          echo '=== Context around 2025 / CUADROS ==='
          grep -Ein -C 2 '2025|CUADROS ESTAD|estadisticas-policiales|estadísticas-policiales' /tmp/police.html \
            | head -n 250 || true

          echo '=== Script sources ==='
          grep -Eoi '<script[^>]+src=["'"'"'][^"'"'"']+' /tmp/police.html \
            | sed -E 's/.*src=["'"'"']//I' | head -n 100 || true
