name: Regenerar snapshot policial 2025

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-police-2025.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar lector XLSX
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Regenerar snapshot desde el libro oficial 2025
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.ine.gob.cl/docs/default-source/estadisticas-policiales-y-judiciales/cuadro-estad%C3%ADstico/estadisticas-policiales/2025/estad%C3%ADsticas-policiales_penal_2025.xlsx?sfvrsn=9579c5aa_4'
          python3 scripts/extract-police.py "$url" --output public/police-data.json

      - name: Validar contrato y cifras de control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('public/police-data.json').read_text(encoding='utf-8'))
          assert data['updated'] == 2025, data['updated']

          institutions = data['institutions']
          expected = {
              ('carabineros', 'denuncias'): 1523703,
              ('pdi', 'denuncias'): 96603,
          }
          for institution, payload in institutions.items():
              for series_name, series in payload['series'].items():
                  latest = [row for row in series if row['year'] == 2025]
                  assert len(latest) == 1, (institution, series_name, len(latest))
                  regions = latest[0]['regions']
                  assert len(regions) == 16, (institution, series_name, len(regions))
                  assert not any(name.startswith('VARIACIÓN') for name in regions), regions
                  if (institution, series_name) in expected:
                      assert latest[0]['total'] == expected[(institution, series_name)], latest[0]

          print('SNAPSHOT_POLICE_2025_OK')
          print('CCH_DENUNCIAS_2025', expected[('carabineros', 'denuncias')])
          print('PDI_DENUNCIAS_2025', expected[('pdi', 'denuncias')])
          PY

      - name: Versionar snapshot actualizado
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/police-data.json; then
            echo 'SNAPSHOT_ALREADY_CURRENT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/police-data.json
          git commit -m 'Actualiza snapshot policial a 2025'
          git push origin HEAD:main
