name: Diagnóstico fuentes policiales 2025

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-police-2025.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Consultar descargas dinámicas del INE
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.ine.gob.cl/estadisticas-por-tema/sociedad-y-condiciones-de-vida/estadisticas-policiales-y-judiciales'
          curl -L --fail --max-time 60 --retry 2 \
            --user-agent 'Mozilla/5.0 INE-Relatos-source-audit/1.0' \
            "$page" -o /tmp/police.html

          echo '=== JavaScript que define hijosCarpeta/getArchivos ==='
          nl -ba /tmp/police.html | sed -n '1715,1825p'

          # La carpeta raíz de CUADROS ESTADÍSTICOS se obtiene del atributo
          # data-folder publicado por la propia página. La llamada se ensaya con
          # los nombres de campo que aparezcan en el JavaScript anterior.
          root_folder='add82975-cfc3-49d5-b27e-de99b7529a9d'
          base="$page"
          echo '=== Ensayo hijosCarpeta con campos habituales ==='
          for field in id idCarpeta carpeta folder folderId; do
            echo "FIELD $field"
            curl -L -sS --max-time 30 \
              --user-agent 'Mozilla/5.0 INE-Relatos-source-audit/1.0' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
              --data-urlencode "$field=$root_folder" \
              "$base/hijosCarpeta/" | head -c 4000 || true
            echo
          done

          echo '=== Ensayo getArchivos con campos habituales ==='
          for field in id idCarpeta carpeta folder folderId; do
            echo "FIELD $field"
            curl -L -sS --max-time 30 \
              --user-agent 'Mozilla/5.0 INE-Relatos-source-audit/1.0' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
              --data-urlencode "$field=$root_folder" \
              "$base/getArchivos/" | head -c 6000 || true
            echo
          done

      - name: Auditar rutas locales no reproducibles
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Referencias /workspace o /home en código ejecutable ==='
          grep -R -nE '(/workspace/|/home/)' scripts public/sdmx app lib db worker tests \
            --include='*.py' --include='*.mjs' --include='*.js' \
            --include='*.ts' --include='*.tsx' --include='*.sh' || true
