name: Diagnóstico fuentes policiales 2025

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-police-2025.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preparar lector XLSX
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Descargar libro penal anual 2025
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.ine.gob.cl/docs/default-source/estadisticas-policiales-y-judiciales/cuadro-estad%C3%ADstico/estadisticas-policiales/2025/estad%C3%ADsticas-policiales_penal_2025.xlsx?sfvrsn=9579c5aa_4'
          curl -L --fail --max-time 60 --retry 2 \
            --user-agent 'Mozilla/5.0 INE-Relatos-source-audit/1.0' \
            "$url" -o /tmp/police-2025.xlsx
          test "$(xxd -p -l 4 /tmp/police-2025.xlsx)" = '504b0304'
          echo "XLSX_BYTES $(wc -c < /tmp/police-2025.xlsx)"

      - name: Inspeccionar hojas y cabeceras relevantes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import openpyxl

          path = "/tmp/police-2025.xlsx"
          wb = openpyxl.load_workbook(path, read_only=True, data_only=True)
          print("SHEETS", json.dumps(wb.sheetnames, ensure_ascii=False))

          keywords = re.compile(r"denunc|deten|v[ií]ctim|carabiner|investigaciones|pdi", re.I)
          for name in wb.sheetnames:
              ws = wb[name]
              matches = []
              preview = []
              for row_index, row in enumerate(ws.iter_rows(values_only=True), start=1):
                  values = list(row[:25])
                  compact = [value for value in values if value not in (None, "")]
                  if row_index <= 12 and compact:
                      preview.append((row_index, compact[:18]))
                  text = " | ".join(str(value) for value in compact)
                  if keywords.search(text):
                      matches.append((row_index, compact[:18]))
                  if row_index >= 80 and len(matches) >= 8:
                      break
              if matches or name in {"1", "6", "7", "15", "17", "23", "28", "37"}:
                  print(f"=== SHEET {name} ===")
                  print("PREVIEW", json.dumps(preview[:12], ensure_ascii=False, default=str))
                  print("MATCHES", json.dumps(matches[:12], ensure_ascii=False, default=str))
          wb.close()
          PY
