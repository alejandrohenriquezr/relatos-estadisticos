name: Regenerar snapshots vitales 2025

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-vital-2025.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar dependencias
        run: npm ci --ignore-scripts

      - name: Descargar la serie histórica oficial
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.ine.gob.cl/docs/default-source/nacimientos-matrimonios-y-defunciones/cuadros-estadisticos/series-hist%C3%B3ricas/series-vitales-1992-2025(p).xlsx?sfvrsn=bfbe614_4'
          curl -L --fail --max-time 60 --retry 2 \
            --user-agent 'Mozilla/5.0 INE-Relatos-source-audit/1.0' \
            "$url" -o /tmp/series-vitales-1992-2025p.xlsx
          test "$(xxd -p -l 4 /tmp/series-vitales-1992-2025p.xlsx)" = '504b0304'

      - name: Regenerar los cinco snapshots públicos
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseVitalStatistics } from './lib/vital-statistics-data.ts';

          const bytes = fs.readFileSync('/tmp/series-vitales-1992-2025p.xlsx');
          const input = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const payload = parseVitalStatistics(input);
          const summary = {
            births: payload.births.series.at(-1),
            fertility: payload.fertility.series.at(-1),
            deaths: payload.deaths.series.at(-1),
            mortality: payload.mortality.series.at(-1),
            marriages: payload.unions.marriages.at(-1),
            auc: payload.unions.auc.at(-1),
          };

          for (const [name, last] of Object.entries(summary)) {
            if (!last || last.year !== 2025)
              throw new Error(`${name} no termina en 2025: ${JSON.stringify(last)}`);
          }
          if (summary.births.observed !== 146446)
            throw new Error(`Nacimientos 2025 inesperados: ${summary.births.observed}`);
          if (Math.abs(summary.fertility.tgf - 0.99) > 0.001)
            throw new Error(`TGF 2025 inesperada: ${summary.fertility.tgf}`);
          if (Math.abs(summary.mortality.crude - 6.3) > 0.01)
            throw new Error(`Mortalidad 2025 inesperada: ${summary.mortality.crude}`);

          const write = (path, value) =>
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`, 'utf8');
          write('public/births-data.json', payload.births);
          write('public/fertility-data.json', payload.fertility);
          write('public/deaths-data.json', payload.deaths);
          write('public/mortality-data.json', payload.mortality);
          write('public/unions-data.json', payload.unions);

          console.log('VITAL_2025_SNAPSHOTS_OK', JSON.stringify(summary));
          NODE

      - name: Validar integridad antes de versionar
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-repository-integrity.py
          grep -q '"year": 2025' public/births-data.json
          grep -q '"observed": 146446' public/births-data.json
          grep -q '"year": 2025' public/fertility-data.json
          grep -q '"year": 2025' public/deaths-data.json
          grep -q '"year": 2025' public/mortality-data.json
          grep -q '"year": 2025' public/unions-data.json

      - name: Versionar snapshots actualizados
        shell: bash
        run: |
          set -euo pipefail
          files=(
            public/births-data.json
            public/fertility-data.json
            public/deaths-data.json
            public/mortality-data.json
            public/unions-data.json
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'VITAL_SNAPSHOTS_ALREADY_CURRENT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Actualiza snapshots vitales a 2025(p)'
          git push origin HEAD:main
