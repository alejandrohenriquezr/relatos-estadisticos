name: Finaliza último período ENE

on:
  push:
    branches: [main]
    paths:
      - "scripts/finalize-ene-latest.py"
      - ".github/workflows/finalize-ene-latest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar cambio determinístico
        run: python3 scripts/finalize-ene-latest.py
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Formatear
        run: npx prettier --write app/page.tsx
      - name: Validar lint
        run: npm run lint
      - name: Ejecutar pruebas completas
        run: npm test
      - name: Validar integridad
        run: python3 scripts/check-repository-integrity.py
      - name: Verificar ausencia del hardcode inicial
        run: |
          if grep -n 'useState("Mar - May")\|p.year === 2026 && p.quarter === "Mar - May"' app/page.tsx; then
            echo "Persisten hardcodes ENE obsoletos" >&2
            exit 1
          fi
      - name: Configurar autor
        run: git config user.name github-actions-bot
      - name: Configurar correo
        run: git config user.email github-actions-bot@users.noreply.github.com
      - name: Versionar cambio validado
        run: git add app/page.tsx && git commit -m "Deriva el último período ENE del snapshot" && git push origin HEAD:main
