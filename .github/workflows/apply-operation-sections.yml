name: Integrar secciones CMS

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-operation-sections.py"
      - "app/OperationSections.tsx"
      - "app/OperationSections.module.css"
      - "app/admin/operations/**"
      - "app/api/admin/operations/**"
      - ".github/workflows/apply-operation-sections.yml"

permissions:
  contents: write

concurrency:
  group: integrar-secciones-cms
  cancel-in-progress: false

jobs:
  integrar:
    if: ${{ !contains(github.event.head_commit.message, '[cms-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Aplicar parche
        run: python3 scripts/apply-operation-sections.py

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas y build
        run: npm test

      - name: Integridad
        run: python3 scripts/check-repository-integrity.py

      - name: Consolidar cambio validado
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo "app/page.tsx ya estaba integrado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Integra configuración CMS en las operaciones [cms-integrated]"
          git push origin HEAD:main
