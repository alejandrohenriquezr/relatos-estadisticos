name: Auditoría estática de cierre

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-static-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar datos estáticos y errores de lint
        shell: bash
        run: |
          set -uo pipefail
          echo '=== HARDCODES DE PERIODOS 2026 EN APP/LIB ==='
          grep -RInE --include='*.ts' --include='*.tsx' 'Ene - Mar|Feb - Abr|Mar - May|Abr - Jun|May - Jul|Jun - Ago|Jul - Sep|Agosto de 2026|Julio de 2026' app lib || true
          echo '=== LINT ==='
          npm ci --ignore-scripts >/dev/null 2>&1
          npm run lint 2>&1 || true
          echo '=== CONTEXTOS ==='
          for spec in 'app/EconomicPage.tsx:645:670' 'app/TemporalChartControls.tsx:105:125' 'app/page.tsx:455:500' 'app/page.tsx:2645:2680' 'app/page.tsx:3265:3300' 'app/page.tsx:4795:4830' 'app/page.tsx:8945:8990' 'lib/labor-sdmx.ts:1:45' 'lib/price-sdmx.ts:1:40'; do
            file=${spec%%:*}; rest=${spec#*:}; start=${rest%%:*}; end=${rest##*:};
            echo "--- $file:$start-$end ---"
            nl -ba "$file" | sed -n "${start},${end}p"
          done
